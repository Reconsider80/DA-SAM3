[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "da-sam3"
version = "0.1.0"
description = "Dual-Adaptive SAM3 for parameter-efficient medical image segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
  "matplotlib>=3.7.0",
  "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["da_sam3*"]
